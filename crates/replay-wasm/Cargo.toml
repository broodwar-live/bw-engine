[package]
name = "replay-wasm"
version = "0.1.0"
description = "WASM bindings for the BW replay parser and map engine"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
replay-core = { path = "../replay-core" }
bw-engine = { path = "../bw-engine", default-features = false, optional = true }
wasm-bindgen.workspace = true
serde.workspace = true
serde-wasm-bindgen.workspace = true

[features]
# Default build keeps the full map/asset + simulation API for existing users.
# For a parser-only bundle (just `parseReplay`), build with
# `--no-default-features`.
default = ["sim"]
# Map, MPQ, CHK/SCX, TBL, GRP and tileset bindings.
map = ["dep:bw-engine"]
# Experimental game simulation (`GameSim`). Implies `map`.
sim = ["map", "bw-engine/sim"]
