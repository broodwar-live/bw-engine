[package]
name = "bw-engine"
version = "0.1.0"
description = "StarCraft: Brood War engine reimplementation for WASM"
edition.workspace = true
# Not MIT: parts are derived from OpenBW, which publishes no license. See NOTICE.
license-file = "../../NOTICE"
publish = false
repository.workspace = true

[dependencies]
thiserror.workspace = true
bitflags.workspace = true
flate2.workspace = true
explode.workspace = true
encoding_rs.workspace = true

[features]
default = ["sim"]
# Experimental game simulation (game loop, units, pathfinding, vision).
# Map/CHK/MPQ/asset parsing is always available.
sim = []

[dev-dependencies]
replay-core = { path = "../replay-core" }
criterion.workspace = true

[[bench]]
name = "simulation"
harness = false
required-features = ["sim"]

[[test]]
name = "replay_sim"
required-features = ["sim"]

[[test]]
name = "real_data"
required-features = ["sim"]
